name: Source checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --no-cache-dir -r requirements-dev.txt
      - run: python scripts/check_version.py
        env:
          VERSION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: python -m pytest -q
      - run: node --check static/direct-edit.js
      - run: node tests/direct_edit.test.cjs
      - run: node --check static/app.js
      - run: node --check static/clip-controls.js
      - run: node --check static/separation-controls.js
      - run: node tests/player_controls.test.cjs
      - run: node tests/idle_polling.test.cjs
      - run: python scripts/audit_public_files.py

  publish-version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/publish_release.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
